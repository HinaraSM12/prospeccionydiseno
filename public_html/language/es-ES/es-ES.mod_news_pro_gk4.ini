MOD_NEWS_PRO_GK4_CROP_RULES="Reglas"
MOD_NEWS_PRO_GK4_CROP_RULES_DESC="Se pueden definir dos tipos de reglas: Con el nombre de la clase utilizada en la imagen y con el tamaño de la imagen. El primer tipo tiene la siguiente sintaxis: CLASS_NAME=TOP:RIGHT:BOTTOM:LEFT; donde TOP/RIGHT/BOTTOM/LEFT son valores en píxeles. El segundo tipo de normas tiene la siguiente sintaxis:WIDTH:HEIGHT=TOP:RIGHT:BOTTOM:LEFT; donde WIDTH y HEIGHT son dimensiones de la imagen que desea recortar."
