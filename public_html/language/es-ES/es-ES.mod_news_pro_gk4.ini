MOD_NEWS_PRO_GK4_ABOUT_US_CONTENT="<div style='color: #555; line-height: 18px; font-size: 12px; padding: 20px 0 0'><p><strong>Author:</strong></p>News Show Pro GK4 ha sido desarrollado por <a href='http://www.gavick.com' target='_blank' style='color: #AB3F0A'>GavickPro</a>. Desde 2007 nos hemos centrado en la creación de <a href='http://www.gavick.com/products/templates.html' target='_blank' style='color: #AB3F0A'>plantillas Joomla </a> para satisfacer tus expectativs. Además, te proporcionamos  <a href='https://www.gavick.com/news-show-pro-gk4.html' target='_blank' style='color: #AB3F0A'>extensiones gratuitas</a>, módulos and puedes visitar nuestra <a href='http://www.gavickmagazine.com' target='_blank' style='color: #AB3F0A'>Revista Gavick</a> donde es posible que obtengas información de utilidad relacionada con los servicios proporcionados y como evitar problemas.<p style='font-size: 11px; text-align: center;margin: 60px -10px 0; border-top: 1px solid #eee; padding: 6px 0'>News Show Pro GK4 se distribuye bajo <a href='http://www.gnu.org/licenses/gpl-2.0.html' target='_blank' style='color: #AB3F0A'>licencia GNU/GPL v2.</a></p></div>"


MOD_NEWS_PRO_GK4_SIMPLE_CROP="Configuración por defecto del recorte de la imagen"
