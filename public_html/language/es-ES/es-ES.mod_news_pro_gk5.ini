; Configuration check errors

MOD_NEWS_PRO_GK5_PROBLEM_GD_LIB="<h3>GD library no Instalado</h3><p>La biblioteca GD es responsable de la creación de imágenes en miniatura - sin esta biblioteca no se crearán las miniaturas. En lugar de las miniaturas del módulo se utilizará imágenes originales redimensionadas por el navegador - que puede afectar a la velocidad de carga de las páginas.</p>"
MOD_NEWS_PRO_GK5_PROBLEM_CURL="<h3>La librería cURL no esta instalada</h3><p>La librería cURL es responsable de la descarga de imágenes o imágenes externas con la ruta absoluta en el contenido del artículo. Sin ella el módulo mostrara las imágenes o imágenes externas con la ruta absoluta como la imagen de artículo en el contenido generado.</p>"
MOD_NEWS_PRO_GK5_PROBLEM_CACHE_DIR="<h3>El directorio de caché no permite escribir</h3><p>El directorio de caché almacena todas la miniaturas generadas por la librería GD. Si no se permite escribir no se podrán almacenar las miniaturas y el módulo presentará imágenes en blanco.</p>"
MOD_NEWS_PRO_GK5_PROBLEM_CACHE_TIME="<h3>El tiempo de caché puede ser demasiado pequeño</h3><p>El tiempo especificado (<= 5 min) puede ser demasiado pequeño y causar ralentización al cargar las páginas debido al mayor uso de la CPU para crear las miniaturas.</p>"
MOD_NEWS_PRO_GK5_NO_PROBLEMS_DETECTED="<h3>Todo está configurado correctamente/h3><p>Su configuración de la biblioteca GD, la configuración de la biblioteca CURL y permisos de directorio de caché son correctas.</p>"

